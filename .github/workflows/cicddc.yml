name: Employee Management CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js version
        run: node --version

      - name: Check npm version
        run: npm --version

      - name: Run tests
        run: apt update
