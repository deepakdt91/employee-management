services:

  app:
    build: .
    container_name: employee-management-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: employee_user
      DB_PASSWORD: Password@123
      DB_NAME: employee_management
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: employee-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword@123
      MYSQL_DATABASE: employee_management
      MYSQL_USER: employee_user
      MYSQL_PASSWORD: Password@123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
